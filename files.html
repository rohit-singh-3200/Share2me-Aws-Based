<script>

  function handleLogin() {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);

  const accessToken = params.get("access_token");
  const idToken = params.get("id_token");

  if (accessToken && idToken) {
    localStorage.setItem("access_token", accessToken);
    localStorage.setItem("id_token", idToken);

    window.history.replaceState({}, document.title, "files.html");
  }
}

//private file upload function
async function uploadFile() {

  const fileInput = document.getElementById("fileinput");
  const file = fileInput.files[0];
  const status = document.getElementById("status");

  if (!file) {
    alert("Select a file first");
    return;
  }

  const token = localStorage.getItem("access_token");

  status.innerText = "⏳ Requesting upload permission...";

  const apiUrl = "https://xv1qd0hqgh.execute-api.us-east-1.amazonaws.com/dev-upload-files/upload-url";

  // 1. Get pre-signed URL (NOW WITH AUTH HEADER)
  const res = await fetch(apiUrl, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`
    },
    body: JSON.stringify({
      filename: file.name,
      contentType: file.type || "application/octet-stream"
    })
  });

  if (!res.ok) {
    status.innerText = "❌ Failed to get upload URL";
    return;
  }

  const { uploadUrl } = await res.json();

  status.innerText = "⬆️ Uploading file...";

  // 2. Upload file directly to S3
  await fetch(uploadUrl, {
    method: "PUT",
    headers: {
      "Content-Type": file.type || "application/octet-stream"
    },
    body: file
  });

  status.innerText = "✅ Upload successful!";

  // Refresh file list
  loadPrivateFiles();
}
</script>






<!-- Load private files -->
<script>
async function loadPrivateFiles() {
  const container = document.getElementById("privateFiles");

  const token = localStorage.getItem("access_token");

  const res = await fetch(
    "https://xv1qd0hqgh.execute-api.us-east-1.amazonaws.com/list-files/list-files",
    {
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  const files = await res.json();

  container.innerHTML = ""; // clear existing

  if (!files.length) {
    container.innerHTML = "<p>No files uploaded yet.</p>";
    return;
  }

  files.forEach(file => {
    const card = document.createElement("div");
    card.className = "file-card";

    card.innerHTML = `
      <div class="file-name">${file.name}</div>
      <div class="file-meta">
        Uploaded: ${new Date(file.lastModified).toLocaleDateString()}
      </div>
<div class="file-menu">
  <button class="menu-btn" onclick="toggleMenu(this)">⋮</button>
  <div class="menu-dropdown">
    <button onclick="downloadFile('${file.name}')">Download</button>
    <button onclick="deleteFile('${file.name}')">Delete</button>
    <button onclick="shareFile('${file.name}')">Share</button>
  </div>
</div>
`;

    container.appendChild(card);
  });
}
</script>




<script>
// private file Download function
async function downloadFile(filename) {

  const token = localStorage.getItem("access_token");

  const res = await fetch(
    `https://xv1qd0hqgh.execute-api.us-east-1.amazonaws.com/download-file/download?filename=${encodeURIComponent(filename)}`,
    {
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  if (!res.ok) {
    alert("Download failed");
    return;
  }

  const data = await res.json();

  // Redirect browser to S3 presigned URL
  window.location.href = data.downloadUrl;
}



// private file Delete function
async function deleteFile(filename) {

  const confirmed = confirm(`Delete ${filename}?`);
  if (!confirmed) return;

  const token = localStorage.getItem("access_token");

  const res = await fetch(
    `https://xv1qd0hqgh.execute-api.us-east-1.amazonaws.com/delete-file/delete?filename=${encodeURIComponent(filename)}`,
    {
      method: "DELETE",
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  if (!res.ok) {
    alert("Delete failed");
    return;
  }

  alert("File deleted successfully");

  // Refresh list
  loadPrivateFiles();
  loadMarketplaceFiles();
}





function toggleMenu(button) {
  const dropdown = button.nextElementSibling;

  document.querySelectorAll(".menu-dropdown").forEach(menu => {
    if (menu !== dropdown) menu.style.display = "none";
  });

  dropdown.style.display =
    dropdown.style.display === "block" ? "none" : "block";
}

//Sharing logic

let currentShareFile = "";

function shareFile(filename) {
  currentShareFile = filename;
  document.getElementById("shareFileName").innerText = `Share ${filename}`;
  document.getElementById("shareEmail").value = "";
  document.getElementById("shareModal").classList.remove("hidden");
  document.getElementById("shareUserBtn").addEventListener("click", async () => {

  const email = document.getElementById("shareEmail").value;
  if (!email) return alert("Enter email");

  const token = localStorage.getItem("id_token");

  const res = await fetch(
    "https://xv1qd0hqgh.execute-api.us-east-1.amazonaws.com/dev/sharefile",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`
      },
      body: JSON.stringify({
        fileName: currentShareFile,
        sharedWithEmail: email
      })
    }
  );

  if (!res.ok) {
    alert("Sharing failed");
    return;
  }

  alert("File shared successfully!");
  closeShareModal();

  document.getElementById("copyPublicLinkBtn").addEventListener("click", async () => {

  const token = localStorage.getItem("id_token");

  const res = await fetch(
    `https://xv1qd0hqgh.execute-api.us-east-1.amazonaws.com/download-file/download?filename=${encodeURIComponent(currentShareFile)}`,
    {
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  if (!res.ok) {
    alert("Failed to generate link");
    return;
  }

  const data = await res.json();
  await navigator.clipboard.writeText(data.downloadUrl);

  alert("Public link copied!");
});

});

}
function closeShareModal() {
  document.getElementById("shareModal").classList.add("hidden");
}

//Show username
function showWelcomeMessage() {
  const idToken = localStorage.getItem("id_token");
  if (!idToken) return;

  const payload = JSON.parse(atob(idToken.split(".")[1]));
  const email = payload.email;

  if (!email) return;

  // Extract text before @
  let username = email.split("@")[0];

  // Remove dots, numbers (optional)
  username = username.replace(/[0-9]/g, "");
  username = username.replace(/\./g, " ");

  // Capitalize first letter of each word
  username = username
    .split(" ")
    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
    .join(" ");

  const welcomeDiv = document.getElementById("welcomeUser");
  if (welcomeDiv) {
    welcomeDiv.innerText = `Welcome, ${username}`;
  }
}

      "&response_type=token" +
      "&scope=email+openid" +
      "&redirect_uri=https://d2q93x200huoh6.cloudfront.net/files.html";

}

  await handleLogin();
  await requireAuth();
  await showWelcomeMessage();

  await loadMarketplaceFiles();
  await loadSharedToMeFiles();
}
