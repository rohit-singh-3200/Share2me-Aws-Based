<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Share2Me Demo Preview</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #1e3a8a, #7c3aed);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Floating background glow */
body::before,
body::after {
  content: "";
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  filter: blur(120px);
  z-index: -1;
}

body::before {
  background: #3b82f6;
  top: -150px;
  left: -150px;
  opacity: 0.5;
}

body::after {
  background: #a855f7;
  bottom: -150px;
  right: -150px;
  opacity: 0.5;
}

.demo-container {
  width: 1100px;
  height: 600px;
  display: flex;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(30px);
  border-radius: 24px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.4);
  overflow: hidden;
  animation: float 6s ease-in-out infinite;
}

/* Sidebar */
.sidebar {
  width: 220px;
  background: rgba(0,0,0,0.25);
  padding: 30px 20px;
  color: white;
}

.logo {
  font-size: 1.3rem;
  font-weight: bold;
  margin-bottom: 40px;
}

.menu-item {
  margin-bottom: 20px;
  opacity: 0.8;
}

.menu-item.active {
  opacity: 1;
  font-weight: 600;
}

/* Content */
.content {
  flex: 1;
  padding: 40px;
  position: relative;
  color: white;
}

.header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 40px;
}

.upload-btn {
  background: linear-gradient(135deg, #3b82f6, #a855f7);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 0.8rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.card {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(25px);
  border-radius: 16px;
  padding: 20px;
  transition: 0.3s ease;
}

.card:hover {
  transform: translateY(-8px);
  background: rgba(255,255,255,0.3);
}

.file-name {
  font-weight: 600;
  margin-bottom: 8px;
}

.meta {
  font-size: 0.8rem;
  opacity: 0.8;
}

/* Share Modal */
.share-modal {
  position: absolute;
  right: 60px;
  bottom: 60px;
  width: 260px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(25px);
  border-radius: 16px;
  padding: 20px;
}

.share-modal input {
  width: 100%;
  padding: 8px;
  border-radius: 8px;
  border: none;
  margin: 10px 0;
}

.share-modal button {
  width: 100%;
  padding: 8px;
  border-radius: 8px;
  border: none;
  background: linear-gradient(135deg, #3b82f6, #a855f7);
  color: white;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}
</style>
</head>

<body>

<div class="demo-container">

  <div class="sidebar">
    <div class="logo">Share2Me</div>
    <div class="menu-item active">📁 My Files</div>
    <div class="menu-item">📥 Shared With Me</div>
    <div class="menu-item">👥 Marketplace</div>
  </div>

  <div class="content">

    <div class="header">
      <div>Welcome, Rohit</div>
      <div class="upload-btn">Upload</div>
    </div>

    <div class="grid">

      <div class="card">
        <div class="file-name">project-report.pdf</div>
        <div class="meta">Uploaded • Jan 20</div>
      </div>

      <div class="card">
        <div class="file-name">design-mockup.png</div>
        <div class="meta">Uploaded • Jan 18</div>
      </div>

      <div class="card">
        <div class="file-name">aws-architecture.png</div>
        <div class="meta">Shared with 2 users</div>
      </div>

    </div>

    <div class="share-modal">
      <h4>Share aws-architecture.png</h4>
      <input placeholder="Enter email address">
      <button>Share</button>
    </div>

  </div>

</div>

</body>
</html>
